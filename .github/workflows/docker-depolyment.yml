name: deployed the hotstar application to docker container

on:
  push:
    branches:
      - dev
    paths-ignore:
      - README.md

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3
      
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: build the image
        run: docker build -t akbarmohd/hotstar01:v1 .
      
      - name: docker login
        uses: docker/login-action@v3
        with:
           username: ${{ secrets.Docker_USERNAME }}
           password: ${{ secrets.Docker_PASSWORD }}
      
      # - name: push to docker hub and deployed to docker container
      #   run: |
      #      docker push akbarmohd/hotstar01:v1
      #      docker run -d --name hotstar -p 3000:3000 akbarmohd/hotstar01:v1
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/hotstar-githubaction-application
            docker pull
            docker stop test
            docker rm test
            docker run -d --name hotstar -p 3000:3000 akbarmohd/hotstar01:v1
        
